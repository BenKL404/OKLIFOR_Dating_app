# Réduire si le disque est plein (évite grosses extractions / swap).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Windows : projet sur D:\ et Pub cache sur C:\ → compilateur Kotlin incrémental :
# "this and base files have different roots". Désactiver l’incrémental évite le crash du daemon.
kotlin.incremental=false
# CI : désactiver le daemon Gradle évite "Already watching path" sur GitHub Actions
org.gradle.daemon=false
