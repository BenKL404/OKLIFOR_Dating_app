services:
  api:
    image: oklifor-api:test
    ports:
      - "8100:8100"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/oklifor
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8100
      JWT_SECRET: oklifor-dev-secret-please-change-32chars!!
      OTP_DEV_MODE: true
      MINIO_ENDPOINT: http://10.94.43.169:9000
      MINIO_ACCESS_KEY: oklifor
      MINIO_SECRET_KEY: oklifor-minio-secret
      MINIO_BUCKET_CHAT: oklifor-chat
      MINIO_BUCKET_STATUS: oklifor-status
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - oklifor_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: oklifor
      MINIO_ROOT_PASSWORD: oklifor-minio-secret
    volumes:
      - oklifor_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 oklifor oklifor-minio-secret &&
      mc mb --ignore-existing local/oklifor-chat &&
      mc mb --ignore-existing local/oklifor-status &&
      mc anonymous set download local/oklifor-chat &&
      mc anonymous set download local/oklifor-status
      "
    restart: "no"

volumes:
  oklifor_mongo_data:
  oklifor_minio_data:
