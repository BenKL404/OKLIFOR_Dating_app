services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - oklifor_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: oklifor
      MINIO_ROOT_PASSWORD: oklifor-minio-secret
    volumes:
      - oklifor_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 oklifor oklifor-minio-secret &&
      mc mb --ignore-existing local/oklifor-chat &&
      mc mb --ignore-existing local/oklifor-status &&
      mc anonymous set download local/oklifor-chat &&
      mc anonymous set download local/oklifor-status
      "
    restart: "no"

volumes:
  oklifor_mongo_data:
  oklifor_minio_data:
