services:
  api:
    image: ghcr.io/${GHCR_OWNER}/oklifor-api:latest
    restart: unless-stopped
    expose:
      - "8100"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/oklifor
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8100
      JWT_SECRET: ${JWT_SECRET}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-false}
      OKLIFOR_VERIFICATION_DEMO_APPROVE: ${OKLIFOR_VERIFICATION_DEMO_APPROVE:-false}
      MINIO_ENDPOINT: "http://37.27.222.149:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-oklifor}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_CHAT: oklifor-chat
      MINIO_BUCKET_STATUS: oklifor-status

    volumes:
      - oklifor_data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8100/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      cert-init:
        condition: service_completed_successfully

  cert-init:
    image: alpine
    command: >
      sh -c "
        apk add --no-cache openssl &&
        mkdir -p /shared &&
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout /shared/server.key \
          -out /shared/server.crt \
          -subj '/CN=37.27.222.149'
      "
    volumes:
      - nginx_certs:/shared
    restart: "no"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-oklifor}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - oklifor_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-oklifor} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/oklifor-chat &&
      mc mb --ignore-existing local/oklifor-status &&
      mc anonymous set download local/oklifor-chat &&
      mc anonymous set download local/oklifor-status
      "
    restart: "no"

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - oklifor_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - oklifor_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  oklifor_mongo_data:
  oklifor_redis_data:
  oklifor_minio_data:
  oklifor_data:
  nginx_certs:
