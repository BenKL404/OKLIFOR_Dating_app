name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths: ['backend/**']
  pull_request:
    branches: [main]
    paths: ['backend/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Maven test
        run: cd backend && mvn -B test --file pom.xml

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter (for frontend web)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
      
      - name: Flutter pub get & build web
        run: |
          flutter pub get
          flutter build web --release
      
      - name: Copy Flutter web to backend static resources
        run: |
          rm -rf backend/src/main/resources/static || true
          mkdir -p backend/src/main/resources/static
          cp -r build/web/* backend/src/main/resources/static/
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Maven package (embeds frontend)
        run: cd backend && mvn -B package -DskipTests
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push fullstack image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/oklifor-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/oklifor-api:latest

  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.27.222.149
          username: ${{ secrets.VPS_SSH_USER }}  # À créer dans GitHub secrets
          key: ${{ secrets.VPS_SSH_KEY }}       # Clé privée SSH
          script: |
            cd /opt/oklifor
            git pull origin main
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > backend/.env
            echo "MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}" >> backend/.env
            echo "MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}" >> backend/.env
            echo "GHCR_OWNER=${{ github.repository_owner }}" >> backend/.env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd backend
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
