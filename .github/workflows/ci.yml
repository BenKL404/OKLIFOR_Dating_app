# CI monorepo : Flutter (analyze, test, build APK Android) et backend Spring Boot (test, package JAR).
# Prérequis : dépôt GitHub avec ce fichier ; les checks apparaissent dans Actions.

name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter — analyze, test & APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure assets/.env for build
        run: |
          if [ ! -f assets/.env ]; then
            printf '%s\n' 'OKLIFOR_API_BASE=http://127.0.0.1:8080' > assets/.env
          fi

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oklifor-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  backend:
    name: Backend — test & package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Maven test
        run: mvn -B -ntp test

      - name: Package Spring Boot JAR
        run: mvn -B -ntp package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: oklifor-api-jar
          path: backend/target/*.jar
          if-no-files-found: error
