# CI/CD monorepo Oklifor
#   CI  : Flutter (analyze, test, APK) + Backend (test) — toutes les branches/PR
#   CD  : Docker build → GHCR → déploiement VPS  — push sur main uniquement

name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Flutter ─────────────────────────────────────────────────────────────────
  flutter:
    name: Flutter — analyze, test & APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Ensure assets/.env
        run: |
          [ -f assets/.env ] || printf 'OKLIFOR_API_BASE=http://127.0.0.1:8100\n' > assets/.env

      - name: Build APK release
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: oklifor-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ── Backend tests ────────────────────────────────────────────────────────────
  backend-test:
    name: Backend — test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Maven test
        run: mvn -B -ntp test
        env:
          MONGODB_URI: mongodb://localhost:27017/oklifor_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-at-least-32-characters!!

  # ── Docker build & push ──────────────────────────────────────────────────────
  backend-docker:
    name: Backend — Docker build & push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/oklifor-api
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Déploiement VPS ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy — VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copier docker-compose.prod.yml sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: backend/docker-compose.prod.yml
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_OWNER: ${{ github.repository_owner }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_PAT,GHCR_ACTOR,GHCR_OWNER,DEPLOY_PATH
          script: |
            set -e

            # Authentification GHCR
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            cd "$DEPLOY_PATH"

            # Injecter l'owner de l'image dans l'env local si absent
            grep -q '^GHCR_OWNER=' .env 2>/dev/null || echo "GHCR_OWNER=$GHCR_OWNER" >> .env

            # Pull de la nouvelle image + restart du seul service api
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d --no-deps api

            # Nettoyage des anciennes images
            docker image prune -f

            echo "✓ Déploiement terminé — $(date -u)"
