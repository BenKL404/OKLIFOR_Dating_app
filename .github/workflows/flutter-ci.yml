name: Flutter CI

on:
  push:
    branches: [main, develop]
    paths-ignore: ['backend/**']
  pull_request:
    branches: [main]
    paths-ignore: ['backend/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Flutter pub get
        run: flutter pub get
      
      - name: Flutter analyze
        run: flutter analyze
      
      - name: Flutter test
        run: flutter test
      
      - name: Build web
        run: flutter build web --release --base-href=/oklifor/
